services:
  graphdb:
    image: ontotext/graphdb:10.6.0
    volumes:
      - graphdb-data:/opt/graphdb/home
    ports: ["7200:7200"]
    restart: unless-stopped
    # Direct Workbench access (interview challenge): published with security ON (reader/reader). Not for production.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Internal-only: no host ports published.

  app:
    build: .
    image: sales-intelligence:local
    ports:
      - "8000:8000"
    environment:
      # Overridable from the host; stub runs need no API key.
      DEEPSEEK_APIKEY: ${DEEPSEEK_APIKEY:-}
      ANSWERER: ${ANSWERER:-agent}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPO: ${GRAPHDB_REPO:-sales-kg}
      # Demo creds (interview challenge, not production). GRAPHDB_AUTO_SECURE=0 to skip.
      GRAPHDB_ADMIN_PASSWORD: ${GRAPHDB_ADMIN_PASSWORD:-admin}
      GRAPHDB_READER_PASSWORD: ${GRAPHDB_READER_PASSWORD:-reader}
      GRAPHDB_USER: ${GRAPHDB_USER:-reader}
      GRAPHDB_PASSWORD: ${GRAPHDB_PASSWORD:-reader}
      GRAPHDB_AUTO_SECURE: ${GRAPHDB_AUTO_SECURE:-1}
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://sales:sales@postgres:5432/sales
    volumes:
      # Persist logs on the host; chroma_db is copied into the image (~0.5 MB).
      - ./logs:/app/logs
      # Writable, self-contained data dir (CSVs + extracted facts) mounted clean
      # from the host so the image never ships stale extracted demo facts.
      - ./data/ingest:/app/data
    depends_on:
      graphdb:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: sales-intelligence:local
    command: python -m app.queue.worker
    environment:
      # Overridable from the host; stub runs need no API key.
      DEEPSEEK_APIKEY: ${DEEPSEEK_APIKEY:-}
      ANSWERER: ${ANSWERER:-agent}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPO: ${GRAPHDB_REPO:-sales-kg}
      # Demo creds (interview challenge, not production). GRAPHDB_AUTO_SECURE=0 to skip.
      GRAPHDB_ADMIN_PASSWORD: ${GRAPHDB_ADMIN_PASSWORD:-admin}
      GRAPHDB_READER_PASSWORD: ${GRAPHDB_READER_PASSWORD:-reader}
      GRAPHDB_USER: ${GRAPHDB_USER:-reader}
      GRAPHDB_PASSWORD: ${GRAPHDB_PASSWORD:-reader}
      GRAPHDB_AUTO_SECURE: ${GRAPHDB_AUTO_SECURE:-1}
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://sales:sales@postgres:5432/sales
    volumes:
      # Persist logs on the host; chroma_db is copied into the image (~0.5 MB).
      - ./logs:/app/logs
      # Writable, self-contained data dir (CSVs + extracted facts) mounted clean
      # from the host so the image never ships stale extracted demo facts.
      - ./data/ingest:/app/data
    depends_on:
      graphdb:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  graphdb-data:
  postgres-data:
