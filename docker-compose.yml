services:
  graphdb:
    image: ontotext/graphdb:10.6.0
    ports:
      - "7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/home
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Internal-only: no host ports published.

  app:
    build: .
    image: sales-intelligence:local
    ports:
      - "8000:8000"
    environment:
      # Overridable from the host; stub runs need no API key.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANSWERER: ${ANSWERER:-agent}
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPO: ${GRAPHDB_REPO:-sales-kg}
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://sales:sales@postgres:5432/sales
    volumes:
      # Persist logs on the host; chroma_db is copied into the image (~0.5 MB).
      - ./logs:/app/logs
      # Writable, self-contained data dir (CSVs + extracted facts) mounted clean
      # from the host so the image never ships stale extracted demo facts.
      - ./data/ingest:/app/data
    depends_on:
      graphdb:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  graphdb-data:
  postgres-data:
