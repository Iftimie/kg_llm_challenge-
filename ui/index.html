<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Intelligence Assistant</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #f7f7f8;
    color: #1f2328;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid #d9dce1;
    background: #fff;
  }
  header h1 { margin: 0; font-size: 18px; }
  .engine { margin-top: 2px; font-size: 12px; color: #6b7280; }
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
  }
  .row {
    margin: 0 0 12px;
    display: flex;
    gap: 8px;
  }
  .row .label { font-weight: 600; flex: 0 0 auto; }
  .row .body { white-space: pre-wrap; word-break: break-word; }
  .row.user .label { color: #1d4ed8; }
  .row.assistant .label { color: #047857; }
  .row.error .label { color: #b91c1c; }
  .row.error .body {
    color: #7f1d1d;
    background: #fde8e8;
    border: 1px solid #f5b5b5;
    border-radius: 6px;
    padding: 6px 8px;
  }
  .row.pending .body { color: #6b7280; font-style: italic; }
  .evidence {
    margin-top: 6px;
    width: 100%;
    font-size: 13px;
  }
  .evidence summary { cursor: pointer; color: #4b5563; }
  .evidence pre {
    margin: 6px 0 0;
    padding: 8px;
    background: #eef1f4;
    border: 1px solid #d9dce1;
    border-radius: 6px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .meta-line { margin-top: 6px; color: #6b7280; }
  .row .body a, .meta-line a { color: #1d4ed8; text-decoration: underline; }
  .meta-line a.gdb-secondary { color: #047857; }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #d9dce1;
    background: #fff;
  }
  #message {
    flex: 1 1 auto;
    padding: 8px 10px;
    border: 1px solid #c7ccd3;
    border-radius: 6px;
    font: inherit;
  }
  #send {
    padding: 8px 16px;
    border: 1px solid #1d4ed8;
    border-radius: 6px;
    background: #1d4ed8;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  #send:disabled, #message:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Sales Intelligence Assistant</h1>
  <div class="engine">Retrieval engine: <span id="engine">unknown</span></div>
</header>

<main id="chat" aria-live="polite"></main>

<form id="composer">
  <input id="message" type="text" placeholder="Ask a question about the sales data..." autocomplete="off">
  <button id="send" type="submit">Send</button>
</form>

<script>
(function () {
  "use strict";

  var chat = document.getElementById("chat");
  var form = document.getElementById("composer");
  var input = document.getElementById("message");
  var sendBtn = document.getElementById("send");
  var engineEl = document.getElementById("engine");

  // Client-side conversation history, sent with every request as `history`.
  var history = [];

  var IRI_RE = /https?:\/\/[^\s<>"'`]+/;

  function gdbBase(u) {
    return String(u || "http://localhost:7200").replace(/\/+$/, "").replace("://127.0.0.1:", "://localhost:");
  }

  // Turn bare http(s) IRIs in plain text into <a> nodes without innerHTML.
  // Links open the IRI in GraphDB using the provided GraphDB base URL.
  function linkify(text, gdb) {
    var frag = document.createDocumentFragment();
    var re = /https?:\/\/[^\s<>"'`]+/g;
    var last = 0;
    var m;
    while ((m = re.exec(text)) !== null) {
      var raw = m[0];
      var iri = raw.replace(/[.,;)\]`]+$/, "");
      if (m.index > last) {
        frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      }
      var a = document.createElement("a");
      a.href = gdbBase(gdb) + "/graphs-visualizations?uri=" + encodeURIComponent(iri) + "&role=subject";
      a.title = iri;
      a.textContent = iri;
      a.target = "_blank";
      a.rel = "noopener";
      frag.appendChild(a);
      var trailing = raw.slice(iri.length);
      if (trailing) {
        frag.appendChild(document.createTextNode(trailing));
      }
      last = m.index + raw.length;
    }
    if (last < text.length) {
      frag.appendChild(document.createTextNode(text.slice(last)));
    }
    return frag;
  }

  function addRow(role, text, extraClass, gdb) {
    var row = document.createElement("div");
    row.className = "row " + (extraClass || role.toLowerCase());

    var label = document.createElement("span");
    label.className = "label";
    label.textContent = role + ":";

    var body = document.createElement("span");
    body.className = "body";
    body.textContent = text;
    if (role === "Assistant" && IRI_RE.test(text)) {
      body.textContent = "";
      body.appendChild(linkify(text, gdb));
    }

    row.appendChild(label);
    row.appendChild(body);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  // Gather IRIs from the answer text, sources[].iris, and uri-valued sample cells.
  function collectIris(answerText, sources) {
    var out = [];
    var seen = {};
    function add(iri) {
      if (iri && typeof iri === "string" && !seen[iri]) {
        seen[iri] = true;
        out.push(iri);
      }
    }
    if (answerText) {
      var re = /https?:\/\/[^\s<>"'`]+/g;
      var m;
      while ((m = re.exec(answerText)) !== null) {
        add(m[0].replace(/[.,;)\]`]+$/, ""));
      }
    }
    (sources || []).forEach(function (src) {
      if (src && Array.isArray(src.iris)) {
        src.iris.forEach(add);
      }
      if (src && Array.isArray(src.sample)) {
        src.sample.forEach(function (row) {
          if (!row) { return; }
          Object.keys(row).forEach(function (k) {
            var cell = row[k];
            if (cell && cell.type === "uri" && typeof cell.value === "string") {
              add(cell.value);
            }
          });
        });
      }
    });
    return out;
  }

  function shortIri(iri) {
    if (iri.indexOf("#") !== -1) {
      return iri.slice(iri.indexOf("#") + 1);
    }
    var trimmed = iri.replace(/\/+$/, "");
    var parts = trimmed.split("/");
    return parts[parts.length - 1] || iri;
  }

  function addEvidence(row, sources, meta, answerText) {
    var details = document.createElement("details");
    details.className = "evidence";

    var summary = document.createElement("summary");
    summary.textContent = "Sources / evidence";
    details.appendChild(summary);

    var engine = (meta && meta.engine) ? meta.engine : "(unknown)";
    var engineLine = document.createElement("div");
    engineLine.className = "meta-line";
    engineLine.textContent = "engine: " + engine;
    details.appendChild(engineLine);

    if (meta && meta.sparql) {
      var sparqlLabel = document.createElement("div");
      sparqlLabel.className = "meta-line";
      sparqlLabel.textContent = "sparql:";
      details.appendChild(sparqlLabel);

      var sparqlPre = document.createElement("pre");
      sparqlPre.textContent = meta.sparql;
      details.appendChild(sparqlPre);
    }

    var sourcesPre = document.createElement("pre");
    sourcesPre.textContent = "sources: " + JSON.stringify(sources || [], null, 2);
    details.appendChild(sourcesPre);

    if (meta && meta.graphdb_url) {
      var gdb = gdbBase(meta.graphdb_url);
      var iris = collectIris(answerText, sources);

      var gdbLine = document.createElement("div");
      gdbLine.className = "meta-line";
      gdbLine.appendChild(document.createTextNode("GraphDB: "));

      if (!iris.length) {
        gdbLine.appendChild(document.createTextNode("(no IRIs in answer)"));
      } else {
        iris.forEach(function (iri, i) {
          if (i > 0) {
            gdbLine.appendChild(document.createTextNode(" | "));
          }
          var primary = document.createElement("a");
          primary.href = gdb + "/graphs-visualizations?uri=" + encodeURIComponent(iri) + "&role=subject";
          primary.textContent = shortIri(iri);
          primary.title = iri;
          primary.target = "_blank";
          primary.rel = "noopener";
          gdbLine.appendChild(primary);

          gdbLine.appendChild(document.createTextNode(" "));

          var describe = document.createElement("a");
          describe.href = gdb + "/sparql?query=" + encodeURIComponent("DESCRIBE <" + iri + ">");
          describe.textContent = "DESCRIBE";
          describe.title = "DESCRIBE <" + iri + ">";
          describe.target = "_blank";
          describe.rel = "noopener";
          describe.className = "gdb-secondary";
          gdbLine.appendChild(describe);
        });
      }
      details.appendChild(gdbLine);
    }

    row.appendChild(details);
  }

  function setBusy(busy) {
    input.disabled = busy;
    sendBtn.disabled = busy;
    sendBtn.textContent = busy ? "Thinking\u2026" : "Send";
  }

  async function send(message) {
    addRow("User", message);
    history.push({ role: "user", content: message });

    var pending = addRow("Assistant", "Thinking\u2026", "assistant pending");
    setBusy(true);

    try {
      var res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message, history: history })
      });

      pending.remove();

      if (!res.ok) {
        var detail = "Request failed (" + res.status + ")";
        try {
          var errBody = await res.json();
          if (errBody && errBody.detail) {
            detail += ": " + errBody.detail;
          }
        } catch (ignored) {
          // Non-JSON error body; keep the status-only message.
        }
        addRow("Assistant", detail, "error");
        return;
      }

      var data = await res.json();
      var answer = (data && data.answer) ? data.answer : "(empty answer)";
      var row = addRow("Assistant", answer, null, data && data.meta ? data.meta.graphdb_url : null);
      addEvidence(row, data ? data.sources : [], data ? data.meta : null, answer);

      if (data && data.meta && data.meta.engine) {
        engineEl.textContent = data.meta.engine;
      }
      history.push({ role: "assistant", content: answer });
    } catch (err) {
      pending.remove();
      var messageText = (err && err.message) ? err.message : String(err);
      addRow("Assistant", "Network error: " + messageText, "error");
    } finally {
      setBusy(false);
    }
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (input.disabled) {
      return;
    }
    var message = input.value.trim();
    if (!message) {
      return;
    }
    input.value = "";
    send(message);
  });

  // Show the configured answerer as the initial retrieval-engine hint.
  fetch("/health")
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (data && data.answerer) {
        engineEl.textContent = data.answerer;
      }
    })
    .catch(function () {
      // Health probe is best-effort; the chat still works without it.
    });
})();
</script>
</body>
</html>
