[pytest]
# Live tests need the `opencode` binary, an OpenRouter key and a running
# GraphDB. They are default-off; run them explicitly with `-m live`.
addopts = -m "not live"
markers =
    live: requires live services (opencode, OPENROUTER_API_KEY, GraphDB)
# Fail any single test that runs longer than this (seconds). Thread method is
# the cross-platform watchdog (signal-based timeouts are Unix-only). A test
# that genuinely needs longer should opt out via `@pytest.mark.timeout(None)`
# or a larger `timeout` marker rather than blocking the whole suite.
timeout = 60
timeout_method = thread
